# Securo — o certbot cria a versão HTTPS (-le-ssl) a partir desta.
# Studio Ágil - Adriano Gelain · www.studioagil.com.br
<VirtualHost *:80>
    ServerName financeiro.idxmonitor.com.br

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8130/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8130/

    # Importação de extratos e anexos.
    LimitRequestBody 52428800

    ErrorLog ${APACHE_LOG_DIR}/financeiro-error.log
    CustomLog ${APACHE_LOG_DIR}/financeiro-access.log combined
</VirtualHost>
